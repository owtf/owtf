server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 64m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-cache;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self'; script-src 'self'; style-src 'self'" always;

    # Preserve the browser origin for API command checks. Resolve the backend
    # again after container recreation instead of retaining its old address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://owtf:8009;
    location ~ ^/(api|debug)(/|$) {
        proxy_set_header Host $http_host;
        proxy_pass $backend$request_uri;
        proxy_read_timeout 120s;
    }
    location /assets/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri /index.html;
    }
}
