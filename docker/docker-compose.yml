services:
  owtf:
    container_name: owtf
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    environment:
      OWTF_WORKERS: ${OWTF_WORKERS:-1}
    ports:
      - "8009:8009"
    volumes:
      - owtf_data:/data
    cpus: 1.0
    mem_limit: 512m

volumes:
  owtf_data:
