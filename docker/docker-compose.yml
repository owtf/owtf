services:
  owtf:
    image: ${OWTF_IMAGE:-owtf:local}
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    environment:
      OWTF_WORKERS: ${OWTF_WORKERS:-1}
    ports:
      - "${OWTF_BIND:-127.0.0.1}:${OWTF_PORT:-8009}:8009"
    volumes:
      - owtf_data:/data
    cpus: 1.0
    mem_limit: 512m

volumes:
  owtf_data:
