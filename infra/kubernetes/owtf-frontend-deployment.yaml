apiVersion: apps/v1
kind: Deployment
metadata:
  name: owtf-frontend
  namespace: owtf
  labels:
    app: owtf-frontend
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: owtf-frontend
      component: frontend
  template:
    metadata:
      labels:
        app: owtf-frontend
        component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
      containers:
      - name: owtf-frontend
        image: rahulsurwade08/owtf-frontend:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8019
          protocol: TCP
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 8019
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8019
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always
