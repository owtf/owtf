apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: owtf-ingress
  namespace: owtf
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: owtf-frontend-service
            port:
              number: 8019
      - path: /
        pathType: Prefix
        backend:
          service:
            name: owtf-backend-service
            port:
              number: 8008
      - path: /
        pathType: Prefix
        backend:
          service:
            name: owtf-backend-service
            port:
              number: 8010

