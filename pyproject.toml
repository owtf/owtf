[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "owtf"
description = "An OWASP framework for efficient, evidence-driven web security testing"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE.md"]
authors = [{ name = "Abraham Aranguren", email = "abraham.aranguren@owasp.org" }]
dynamic = ["version", "dependencies"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/owtf/owtf"
Documentation = "https://docs.owtf.org/en/develop/"
Repository = "https://github.com/owtf/owtf"
Changelog = "https://github.com/owtf/owtf/blob/develop/CHANGELOG.md"
Issues = "https://github.com/owtf/owtf/issues"

[project.scripts]
owtf = "owtf.core:main"
owtf-admin = "owtf.cli_admin:main"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
include = ["owtf", "owtf.*"]
exclude = ["owtf.webapp", "owtf.webapp.*"]

[tool.setuptools.dynamic]
version = { attr = "owtf.__version__" }
dependencies = { file = ["requirements/base.txt"] }

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["owtf/webapp", "owtf/data/tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E111", "E114"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
