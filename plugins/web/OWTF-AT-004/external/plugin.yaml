apiVersion: owtf.dev/v1alpha1
kind: Plugin

metadata:
  id: OWTF-AT-004-external
  version: 0.1.0
  title: "Brute Force Testing"
  description: "Provides manual OWTF guidance for Brute Force Testing."

spec:
  techniques:
    - code: OWTF-AT-004
      title: "Brute Force Testing"
      hint: "Review Brute Force Testing and retain concrete evidence."
      priority: 99
      reference: https://owasp.org/www-project-web-security-testing-guide/stable/
  group: web
  type: external
  targetKinds: [url]
  runtime:
    type: external
    external:
      guidance: "Follow the linked OWASP Web Security Testing Guide for Brute Force Testing. Retain the requests, responses, and conclusion as OWTF evidence."
      references:
        - title: OWASP Web Security Testing Guide
          url: https://owasp.org/www-project-web-security-testing-guide/stable/
