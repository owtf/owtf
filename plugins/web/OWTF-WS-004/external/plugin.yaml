apiVersion: owtf.dev/v1alpha1
kind: Plugin

metadata:
  id: OWTF-WS-004-external
  version: 0.1.0
  title: "XML Content-level Testing"
  description: "Provides manual OWTF guidance for XML Content-level Testing."

spec:
  techniques:
    - code: OWTF-WS-004
      title: "XML Content-level Testing"
      hint: "Review XML Content-level Testing and retain concrete evidence."
      priority: 99
      reference: https://owasp.org/www-project-web-security-testing-guide/stable/
