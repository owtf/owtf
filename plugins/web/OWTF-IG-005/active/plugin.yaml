apiVersion: owtf.dev/v1alpha1
kind: Plugin

metadata:
  id: OWTF-IG-005-active
  version: 1.0.0
  title: "Application Discovery"
  description: "Runs bounded Gobuster virtual-host discovery with an operator-supplied wordlist."

spec:
  techniques:
    - code: OWTF-IG-005
      title: "Application Discovery"
      hint: "Identify additional applications hosted below the target domain."
      priority: 99
      reference: https://owasp.org/www-project-web-security-testing-guide/stable/
  group: web
  type: active
  targetKinds: [url]
  inputs:
    - name: wordlist
      type: wordlist
      description: "Name of an operator-reviewed virtual-host wordlist."
      required: true
      maximumBytes: 1048576
      maximumLines: 10000
    - name: threads
      type: integer
      description: "Maximum concurrent requests."
      default: 10
      minimum: 1
      maximum: 50
    - name: delay
      type: string
      description: "Delay applied by each worker between requests."
      default: 100ms
      choices: [0s, 100ms, 500ms, 1s]
    - name: request_timeout
      type: string
      description: "Timeout for each HTTP request."
      default: 10s
      choices: [5s, 10s, 30s]
  runtime:
    type: container
    container:
      image: owtf/kali-tools:local
      network: bridge
      executable: gobuster
      args:
        - vhost
        - --url
        - "{{target}}"
        - --wordlist
        - "{{input:wordlist}}"
        - --append-domain
        - --threads
        - "{{input:threads}}"
        - --delay
        - "{{input:delay}}"
        - --timeout
        - "{{input:request_timeout}}"
        - --no-progress
        - --quiet
        - --no-color
        - --output
        - "{{artifact:vhosts.txt}}"
      artifacts:
        - name: vhosts.txt
          mediaType: text/plain
          required: true
          decoder: gobuster-vhost
