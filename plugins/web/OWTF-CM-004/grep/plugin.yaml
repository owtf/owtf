apiVersion: owtf.dev/v1alpha1
kind: Plugin

metadata:
  id: OWTF-CM-004-grep
  version: 0.1.0
  title: Application Configuration Management
  description: Searches captured response bodies for comments and exposed server-side source markers.

spec:
  techniques:
    - code: OWTF-CM-004
      title: Application Configuration Management
      hint: Do captured responses disclose configuration notes or server-side source?
      priority: 99
      reference: https://owasp.org/www-project-web-security-testing-guide/stable/4-Web_Application_Security_Testing/02-Configuration_and_Deployment_Management_Testing/02-Test_Application_Platform_Configuration
  group: web
  type: grep
  targetKinds: [url]
  runtime:
    type: grep
    grep:
      maxMatches: 100
      rules:
        - id: html-comments
          title: HTML comments for review
          source: response_body
          pattern: '(?is)<!--.{0,1000}?-->'
        - id: php-source
          title: Exposed PHP source marker
          source: response_body
          pattern: '(?i)<\?(php|=)'
        - id: asp-source
          title: Exposed ASP source marker
          source: response_body
          pattern: '(?s)<%[=@]?'
