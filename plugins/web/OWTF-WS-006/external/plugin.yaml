apiVersion: owtf.dev/v1alpha1
kind: Plugin

metadata:
  id: OWTF-WS-006-external
  version: 0.1.0
  title: "Naughty SOAP attachments"
  description: "Provides manual OWTF guidance for Naughty SOAP attachments."

spec:
  techniques:
    - code: OWTF-WS-006
      title: "Naughty SOAP attachments"
      hint: "Review Naughty SOAP attachments and retain concrete evidence."
      priority: 99
      reference: https://owasp.org/www-project-web-security-testing-guide/stable/
  group: web
  type: external
  targetKinds: [url]
  runtime:
    type: external
    external:
      guidance: "Follow the linked OWASP Web Security Testing Guide for Naughty SOAP attachments. Retain the requests, responses, and conclusion as OWTF evidence."
      references:
        - title: OWASP Web Security Testing Guide
          url: https://owasp.org/www-project-web-security-testing-guide/stable/
