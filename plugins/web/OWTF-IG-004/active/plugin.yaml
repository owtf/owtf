apiVersion: owtf.dev/v1alpha1
kind: Plugin

metadata:
  id: OWTF-IG-004-active
  version: 1.0.0
  title: "Web Application Fingerprint"
  description: "Runs WhatWeb and retains its structured technology fingerprint."

spec:
  techniques:
    - code: OWTF-IG-004
      title: "Web Application Fingerprint"
      hint: "What is that site running?"
      priority: 99
      reference: https://owasp.org/www-project-web-security-testing-guide/v42/4-Web_Application_Security_Testing/01-Information_Gathering/08-Fingerprint_Web_Application_Framework
  group: web
  type: active
  targetKinds: [url]
  inputs:
    - name: aggression
      type: string
      description: "WhatWeb aggression level; level 4 sends the most requests."
      default: "4"
      choices: ["1", "3", "4"]
    - name: threads
      type: integer
      description: "Maximum concurrent WhatWeb requests."
      default: 4
      minimum: 1
      maximum: 20
  requirements:
    commands: [whatweb]
  runtime:
    type: command
    command:
      executable: whatweb
      args:
        - --color
        - never
        - --quiet
        - --aggression
        - "{{input:aggression}}"
        - --max-threads
        - "{{input:threads}}"
        - --log-json
        - "{{artifact:whatweb.json}}"
        - "{{target}}"
      artifacts:
        - name: whatweb.json
          mediaType: application/json
          required: true
