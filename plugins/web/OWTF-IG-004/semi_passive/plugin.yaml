apiVersion: owtf.dev/v1alpha1
kind: Plugin

metadata:
  id: OWTF-IG-004-semi_passive
  version: 0.1.0
  title: HTTP fingerprint capture
  description: Uses curl to preserve response headers and body for fingerprint review.

spec:
  techniques:
    - code: OWTF-IG-004
      title: Web Application Fingerprint
      hint: What is that site running?
      priority: 99
      reference: https://owasp.org/www-project-web-security-testing-guide/v42/4-Web_Application_Security_Testing/01-Information_Gathering/08-Fingerprint_Web_Application_Framework
  group: web
  type: semi_passive
  targetKinds:
    - url
  inputs:
    - name: timeout_seconds
      type: integer
      description: Maximum time allowed for the HTTP request.
      default: 20
      minimum: 1
      maximum: 300
    - name: user_agent
      type: string
      description: User-Agent header sent with the request.
      default: OWTF
  requirements:
    commands:
      - curl
  runtime:
    type: command
    command:
      executable: curl
      args:
        - --silent
        - --show-error
        - --max-time
        - "{{input:timeout_seconds}}"
        - --user-agent
        - "{{input:user_agent}}"
        - --proto
        - =http,https
        - --dump-header
        - "{{artifact:response-headers}}"
        - --output
        - "{{artifact:response-body}}"
        - "{{target}}"
      artifacts:
        - name: response-headers
          mediaType: text/plain
          required: true
        - name: response-body
          mediaType: application/octet-stream
          required: true
