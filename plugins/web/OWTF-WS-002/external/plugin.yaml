apiVersion: owtf.dev/v1alpha1
kind: Plugin

metadata:
  id: OWTF-WS-002-external
  version: 0.1.0
  title: "Testing WSDL"
  description: "Provides manual OWTF guidance for Testing WSDL."

spec:
  techniques:
    - code: OWTF-WS-002
      title: "Testing WSDL"
      hint: "Review Testing WSDL and retain concrete evidence."
      priority: 99
      reference: https://owasp.org/www-project-web-security-testing-guide/stable/
  group: web
  type: external
  targetKinds: [url]
  runtime:
    type: external
    external:
      guidance: "Follow the linked OWASP Web Security Testing Guide for Testing WSDL. Retain the requests, responses, and conclusion as OWTF evidence."
      references:
        - title: OWASP Web Security Testing Guide
          url: https://owasp.org/www-project-web-security-testing-guide/stable/
