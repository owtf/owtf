apiVersion: owtf.dev/v1alpha1
kind: Plugin

metadata:
  id: OWTF-AJ-001-external
  version: 0.1.0
  title: "AJAX Vulnerabilities"
  description: "Provides manual OWTF guidance for AJAX Vulnerabilities."

spec:
  techniques:
    - code: OWTF-AJ-001
      title: "AJAX Vulnerabilities"
      hint: "Review AJAX Vulnerabilities and retain concrete evidence."
      priority: 99
      reference: https://owasp.org/www-project-web-security-testing-guide/stable/
  group: web
  type: external
  targetKinds: [url]
  runtime:
    type: external
    external:
      guidance: "Follow the linked OWASP Web Security Testing Guide for AJAX Vulnerabilities. Retain the requests, responses, and conclusion as OWTF evidence."
      references:
        - title: OWASP Web Security Testing Guide
          url: https://owasp.org/www-project-web-security-testing-guide/stable/
