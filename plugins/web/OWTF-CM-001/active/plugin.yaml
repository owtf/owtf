apiVersion: owtf.dev/v1alpha1
kind: Plugin

metadata:
  id: OWTF-CM-001-active
  version: 1.0.0
  title: "Testing for SSL-TLS"
  description: "Runs testssl.sh and retains its machine-readable TLS assessment."

spec:
  techniques:
    - code: OWTF-CM-001
      title: "Testing for SSL-TLS"
      hint: "Does the response advertise a strict HTTPS transport policy?"
      priority: 99
      reference: https://owasp.org/www-project-web-security-testing-guide/
  group: web
  type: active
  targetKinds: [url]
  requirements:
    commands: [testssl.sh]
  runtime:
    type: command
    command:
      executable: testssl.sh
      args:
        - --quiet
        - --color
        - "0"
        - --jsonfile
        - "{{artifact:testssl.json}}"
        - "{{target}}"
      artifacts:
        - name: testssl.json
          mediaType: application/json
          required: true
