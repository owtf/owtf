apiVersion: owtf.dev/v1alpha1
kind: Plugin

metadata:
  id: OWTF-WS-007-external
  version: 0.1.0
  title: "WS Replay Testing"
  description: "Provides manual OWTF guidance for WS Replay Testing."

spec:
  techniques:
    - code: OWTF-WS-007
      title: "WS Replay Testing"
      hint: "Review WS Replay Testing and retain concrete evidence."
      priority: 99
      reference: https://owasp.org/www-project-web-security-testing-guide/stable/
  group: web
  type: external
  targetKinds: [url]
  runtime:
    type: external
    external:
      guidance: "Follow the linked OWASP Web Security Testing Guide for WS Replay Testing. Retain the requests, responses, and conclusion as OWTF evidence."
      references:
        - title: OWASP Web Security Testing Guide
          url: https://owasp.org/www-project-web-security-testing-guide/stable/
