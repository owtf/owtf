apiVersion: owtf.dev/v1alpha1
kind: Plugin

metadata:
  id: PTES-001-active
  version: 0.1.0
  title: FTP Service Probe
  description: Uses Nmap to identify FTP service metadata and anonymous access.

spec:
  techniques:
    - code: PTES-001
      title: FTP Service Probe
      hint: Does the target expose FTP, and does it permit anonymous access?
      priority: 99
      reference: https://owasp.org/www-project-penetration-testing-execution-standard/
  group: network
  type: active
  targetKinds:
    - hostname
    - ip
  inputs:
    - name: port
      type: integer
      description: TCP port to probe.
      default: 21
      minimum: 1
      maximum: 65535
  requirements:
    commands:
      - nmap
  runtime:
    type: command
    command:
      executable: nmap
      args:
        - -Pn
        - -n
        - -sT
        - -sV
        - --version-light
        - --script
        - ftp-anon,ftp-syst
        - --script-timeout
        - 15s
        - --host-timeout
        - 30s
        - --max-retries
        - "1"
        - -p
        - "{{input:port}}"
        - -oX
        - "{{artifact:nmap.xml}}"
        - "{{target}}"
      artifacts:
        - name: nmap.xml
          mediaType: application/xml
          required: true
