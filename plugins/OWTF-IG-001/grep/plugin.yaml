apiVersion: owtf.dev/v1alpha1
kind: Plugin

metadata:
  id: OWTF-IG-001-grep
  version: 0.1.0
  title: Spiders, Robots, and Crawlers
  description: Searches captured responses for crawler directives.

spec:
  techniques:
    - code: OWTF-IG-001
      title: Spiders, Robots, and Crawlers
      hint: What content does the site disclose to crawlers?
      priority: 99
      reference: https://owasp.org/www-project-web-security-testing-guide/v42/4-Web_Application_Security_Testing/01-Information_Gathering/01-Conduct_Search_Engine_Discovery_Reconnaissance_for_Information_Leakage
  group: web
  type: grep
  targetKinds: [url]
  runtime:
    type: grep
    grep:
      maxMatches: 100
      rules:
        - id: robots-header
          title: X-Robots-Tag directives
          source: response_headers
          pattern: '(?i)"x-robots-tag"\s*:'
        - id: robots-meta
          title: HTML robots metadata
          source: response_body
          pattern: '(?i)<meta[^>]+name\s*=\s*["''][^"'']*(robots?|googlebot|bingbot)[^"'']*["'']'
