apiVersion: owtf.dev/v1alpha1
kind: Plugin

metadata:
  id: PTES-008-active
  version: 0.1.0
  title: RPC over HTTP Probe
  description: Uses Nmap to identify RPC-over-HTTP service and NTLM metadata.

spec:
  techniques:
    - code: PTES-008
      title: RPC over HTTP Probe
      hint: Which RPC-over-HTTP service and NTLM metadata does the target expose?
      priority: 99
      reference: https://owasp.org/www-project-penetration-testing-execution-standard/
  group: network
  type: active
  targetKinds: [hostname, ip]
  inputs:
    - name: port
      type: integer
      description: TCP port to probe.
      default: 593
      minimum: 1
      maximum: 65535
  requirements:
    commands: [nmap]
  runtime:
    type: command
    command:
      executable: nmap
      args:
        - -Pn
        - -n
        - -sT
        - -sV
        - --version-light
        - --script
        - http-ntlm-info
        - --script-timeout
        - 15s
        - --host-timeout
        - 30s
        - --max-retries
        - "1"
        - -p
        - "{{input:port}}"
        - -oX
        - "{{artifact:nmap.xml}}"
        - "{{target}}"
      artifacts:
        - name: nmap.xml
          mediaType: application/xml
          required: true
