apiVersion: owtf.dev/v1alpha1
kind: Plugin

metadata:
  id: PTES-007-active
  version: 0.1.0
  title: MSRPC Endpoint Probe
  description: Uses Nmap to enumerate services exposed by an MSRPC endpoint mapper.

spec:
  techniques:
    - code: PTES-007
      title: MSRPC Endpoint Probe
      hint: Which services does the target expose through its MSRPC endpoint mapper?
      priority: 99
      reference: https://owasp.org/www-project-penetration-testing-execution-standard/
  group: network
  type: active
  targetKinds: [hostname, ip]
  inputs:
    - name: port
      type: integer
      description: TCP port to probe.
      default: 135
      minimum: 1
      maximum: 65535
  requirements:
    commands: [nmap]
  runtime:
    type: command
    command:
      executable: nmap
      args:
        - -Pn
        - -n
        - -sT
        - -sV
        - --version-light
        - --script
        - msrpc-enum
        - --script-timeout
        - 15s
        - --host-timeout
        - 30s
        - --max-retries
        - "1"
        - -p
        - "{{input:port}}"
        - -oX
        - "{{artifact:nmap.xml}}"
        - "{{target}}"
      artifacts:
        - name: nmap.xml
          mediaType: application/xml
          required: true
