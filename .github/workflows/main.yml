name: OWTF CI

on:
  push:
    branches: [develop, owtf-next]
  pull_request:
    branches: [develop, owtf-next]

concurrency:
  group: owtf-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go tests and flow checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - name: Check formatting and static analysis
        run: make lint
      - name: Run unit and integration tests
        run: make test-unit
      - name: Run API and CLI smoke flow
        run: make test-api

  container:
    name: Build container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the Go and SQLite image
        run: docker build --file docker/Dockerfile.backend --tag owtf:ci .
