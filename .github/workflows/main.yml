name: OWTF CI

on:
  push:
    branches: [develop, owtf-next]
  pull_request:
    branches: [develop, owtf-next]

concurrency:
  group: owtf-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go tests and flow checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build and test operator UI
        run: make ui-build ui-test
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - name: Check formatting and static analysis
        run: make lint
      - name: Run unit and integration tests
        run: make test-unit
      - name: Run API and CLI smoke flow
        run: make test-api

  container:
    name: Compose lifecycle and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the Go and SQLite image
        run: docker build --file docker/Dockerfile.backend --tag owtf:ci .
      - name: Build the separate frontend image
        run: docker build --file docker/Dockerfile.frontend --tag owtf-ui:ci .
      - name: Verify Compose lifecycle, backup, and restore
        env:
          OWTF_IMAGE: owtf:ci
          OWTF_UI_IMAGE: owtf-ui:ci
        run: bash scripts/owtf-compose-smoke.sh
      - name: Retain recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-recovery-evidence
          path: build/compose-proof.*/
          retention-days: 7
      - name: Verify proxy controls and HAR lifecycle
        env:
          OWTF_IMAGE: owtf:ci
          OWTF_PROOF_ROOT: build
        run: bash scripts/owtf-proxy-ui-smoke.sh
      - name: Retain proxy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proxy-ui-evidence
          path: build/owtf-proxy-ui.*/
          retention-days: 7
